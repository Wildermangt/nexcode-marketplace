# ---------------------------------------------------------------------------
#  NEXCODE Marketplace  ·  catalogo de versiones
#
#  Un unico sitio donde se declara que version usa cada libreria. Los modulos
#  las referencian con "libs.<alias>", asi que nunca aparece un numero de
#  version suelto dentro de un build.gradle.
# ---------------------------------------------------------------------------

[versions]
# --- Cadena de herramientas ---
agp = "8.7.3"
kotlin = "2.4.10"
googleServicesVersion = "4.5.0"

# --- Capa de presentacion ---
appcompat = "1.7.0"
material = "1.12.0"
constraintlayout = "2.1.4"
recyclerview = "1.3.2"
viewpager2 = "1.1.0"
swiperefresh = "1.1.0"
fragment = "1.8.5"
activity = "1.9.3"

# --- Camara y carga de imagenes ---
camerax = "1.4.2"
glide = "4.16.0"
exifinterface = "1.3.7"
guava = "33.3.1-android"

# --- Servicios remotos ---
firebaseBom = "34.18.0"
coroutines = "1.9.0"

# --- Pruebas ---
junit = "4.13.2"
androidxJunit = "1.2.1"
espresso = "3.6.1"

[libraries]
# --- Capa de presentacion ---
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-viewpager2 = { module = "androidx.viewpager2:viewpager2", version.ref = "viewpager2" }
androidx-swiperefresh = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "swiperefresh" }
androidx-fragment = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
androidx-activity = { module = "androidx.activity:activity-ktx", version.ref = "activity" }

# --- Camara y carga de imagenes ---
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
# CameraX devuelve ListenableFuture en su API publica. Kotlin exige que la clase
# este en el classpath de compilacion; la que arrastra CameraX es el JAR vacio
# "listenablefuture", asi que hay que declarar Guava de verdad.
guava = { module = "com.google.guava:guava", version.ref = "guava" }

# --- Servicios remotos: Firebase entra por lista de materiales ---
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-auth = { module = "com.google.firebase:firebase-auth" }
firebase-firestore = { module = "com.google.firebase:firebase-firestore" }
firebase-storage = { module = "com.google.firebase:firebase-storage" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }

# --- Pruebas ---
junit = { module = "junit:junit", version.ref = "junit" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
googleService = { id = "com.google.gms.google-services", version.ref = "googleServicesVersion" }
