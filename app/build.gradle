android {
    namespace = 'com.nexcode.marketplace'
    compileSdk = 35

    defaultConfig {
        applicationId = "com.nexcode.marketplace"
        minSdk = 24
        targetSdk = 35
        versionCode = 1
        versionName = "1.0"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }

    // Firma de la version de publicacion. Las credenciales se leen de
    // keystore.properties (listado en .gitignore), nunca del codigo. Quien
    // clone el proyecto sin ese archivo puede compilar debug, pero no release.
    def archivoDeFirma = rootProject.file('keystore.properties')
    def credenciales = new Properties()
    if (archivoDeFirma.exists()) {
        archivoDeFirma.withInputStream { credenciales.load(it) }
    }

    signingConfigs {
        if (archivoDeFirma.exists()) {
            release {
                storeFile = rootProject.file(credenciales.getProperty('storeFile'))
                storePassword = credenciales.getProperty('storePassword')
                keyAlias = credenciales.getProperty('keyAlias')
                keyPassword = credenciales.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            if (archivoDeFirma.exists()) {
                signingConfig = signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
        debug {
            // Sin sufijo en el identificador: google-services.json registra un
            // unico paquete, com.nexcode.marketplace, y con sufijo el
            // complemento de Google no encontraria su cliente.
            versionNameSuffix = "-debug"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding = true
    }

    packaging {
        resources {
            excludes += ['META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

